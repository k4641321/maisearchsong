name: Build & Draft Release

# 触发条件：
#   1. 推送到 main / master 分支：自动构建并创建 / 更新草稿发行版
#   2. 推送 v 开头的标签（如 v1.0.0）：自动构建并创建 / 更新草稿发行版
#   3. 在 Actions 页面手动触发：自动构建并创建 / 更新草稿发行版
#
# 无需提前创建或推送标签；草稿发行版按 pubspec.yaml 的版本号关联，
# 仅创建 / 更新草稿，不自动正式发布
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 发行版创建需要写权限
permissions:
  contents: write

# 同一分支上的新提交会取消仍在运行的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: maisearchsong

jobs:
  # ---------------------------------------------------------------
  # 1. 从 pubspec.yaml 读取版本号（version: 1.0.0+1 -> 1.0.0）
  # ---------------------------------------------------------------
  version:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取 pubspec.yaml 版本号
        id: version
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "解析到版本号: ${v}"

  # ---------------------------------------------------------------
  # 2. 构建 Android：APK + AAB
  # ---------------------------------------------------------------
  build-android:
    name: 构建 Android (分 ABI APK + AAB)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi

      - name: 构建 AAB
        run: flutter build appbundle --release

      - name: 重命名构建产物（maisearchsong-版本号-平台[-ABI]）
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd build/app/outputs/flutter-apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mv "app-${abi}-release.apk" "${APP_NAME}-${VERSION}-android-${abi}.apk"
          done
          cd ../bundle/release
          mv app-release.aab "${APP_NAME}-${VERSION}-android.aab"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: 上传 AAB 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14

  # ---------------------------------------------------------------
  # 3. 构建 Windows 并打包为 zip
  # ---------------------------------------------------------------
  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows
        run: flutter build windows --release

      - name: 打包为 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-windows.zip"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-windows.zip
          retention-days: 14

  # ---------------------------------------------------------------
  # 4. 每次触发均创建 / 更新草稿发行版，并附带全部构建产物
  # ---------------------------------------------------------------
  release:
    name: 创建草稿发行版
    runs-on: ubuntu-latest
    needs: [ version, build-android, build-windows ]
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 / 更新草稿发行版
        uses: ncipollo/release-action@v1
        with:
          # 草稿发行版按 pubspec.yaml 版本号关联（如 v1.0.0），无需提前推送标签
          tag: v${{ needs.version.outputs.version }}
          # 作为草稿发布，需要手动点击 Publish 才会正式发布
          draft: true
          # 自动根据提交记录生成 Release Notes
          generateReleaseNotes: true
          # 标签已存在时更新，而不是报错
          allowUpdates: true
          # 仅当发行版仍是草稿/预发布时才更新，不覆盖已正式发布的版本
          updateOnlyUnreleased: true
          # 附带的构建产物
          artifacts: |
            artifacts/android-apk/*.apk
            artifacts/android-aab/*.aab
            artifacts/windows/*.zip
